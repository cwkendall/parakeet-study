# Small FastConformer-CTC config for exercise 4.
# Tuned to fit on a single 24 GB GPU with effective batch ~64.
# Real Parakeet uses 24 layers, 1024 d_model, 8 heads. This is a 12L/256d/4H baby version.

name: fastconformer_ctc_small

model:
  sample_rate: 16000
  log_prediction: true
  ctc_reduction: 'mean_batch'

  train_ds:
    manifest_filepath: ???
    sample_rate: 16000
    batch_size: 16
    shuffle: true
    num_workers: 4
    pin_memory: true
    use_start_end_token: false
    trim_silence: false
    max_duration: 16.7      # drop ultra-long utterances that cause OOM
    min_duration: 0.1

  validation_ds:
    manifest_filepath: ???
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    num_workers: 4
    pin_memory: true
    use_start_end_token: false

  test_ds:
    manifest_filepath: null
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    num_workers: 4
    pin_memory: true
    use_start_end_token: false

  tokenizer:
    dir: ???         # ./tokenizer (sentencepiece model + vocab)
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    window_size: 0.025
    window_stride: 0.01
    window: hann
    features: 80
    n_fft: 512
    log: true
    log_zero_guard_type: add
    log_zero_guard_value: 2**-24
    normalize: per_feature
    frame_splicing: 1
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 5
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    n_layers: 12
    d_model: 256
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    self_attention_model: rel_pos
    n_heads: 4
    att_context_size: [-1, -1]      # full attention (no LCA)
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000
    ff_expansion_factor: 4
    conv_kernel_size: 9
    conv_norm_type: batch_norm
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.ConvASRDecoder
    feat_in: 256
    num_classes: -1     # filled from tokenizer
    vocabulary: []

  optim:
    name: adamw
    lr: 2e-3
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: 256
      warmup_steps: 5000
      min_lr: 1e-5

trainer:
  devices: 1
  accelerator: gpu
  max_steps: 30000
  log_every_n_steps: 50
  val_check_interval: 1.0    # validate every epoch
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  enable_progress_bar: true
  benchmark: false

exp_manager:
  exp_dir: lightning_logs
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    save_top_k: 3
    monitor: val_wer
    mode: min
