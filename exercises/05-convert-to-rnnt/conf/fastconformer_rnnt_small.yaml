# Small FastConformer-RNN-T config for exercise 5.
# Encoder is identical to exercise 4's so the CTC checkpoint can initialise it.

name: fastconformer_rnnt_small

model:
  sample_rate: 16000
  log_prediction: true
  compute_eval_loss: true
  skip_nan_grad: false

  model_defaults:
    enc_hidden: 256
    pred_hidden: 320
    joint_hidden: 320

  train_ds:
    manifest_filepath: ???
    sample_rate: 16000
    batch_size: 8                 # smaller than CTC due to joint memory
    shuffle: true
    num_workers: 4
    pin_memory: true
    use_start_end_token: false
    trim_silence: false
    max_duration: 16.7
    min_duration: 0.1

  validation_ds:
    manifest_filepath: ???
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    use_start_end_token: false

  tokenizer:
    dir: ???
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    window_size: 0.025
    window_stride: 0.01
    window: hann
    features: 80
    n_fft: 512
    log: true
    normalize: per_feature
    log_zero_guard_type: add
    log_zero_guard_value: 2**-24

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 5
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    n_layers: 12
    d_model: 256
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    self_attention_model: rel_pos
    n_heads: 4
    att_context_size: [-1, -1]
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000
    ff_expansion_factor: 4
    conv_kernel_size: 9
    conv_norm_type: batch_norm
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true
    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.1

  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false
    fuse_loss_wer: true
    fused_batch_size: 16
    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: tanh
      dropout: 0.1

  decoding:
    strategy: greedy_batch
    greedy:
      max_symbols: 10

  loss:
    loss_name: default
    warprnnt_numba_kwargs:
      fastemit_lambda: 0.0
      clamp: -1.0

  optim:
    name: adamw
    lr: 5e-4                       # lower than CTC: we're fine-tuning, not training from scratch
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: 256
      warmup_steps: 2000
      min_lr: 1e-5

trainer:
  devices: 1
  accelerator: gpu
  max_steps: 15000
  log_every_n_steps: 50
  val_check_interval: 1.0
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  enable_progress_bar: true

exp_manager:
  exp_dir: lightning_logs
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    save_top_k: 3
    monitor: val_wer
    mode: min
